global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# The scrape job name becomes the `job` label, which ObservaBot uses as the service name.
scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["catalog:8000"]

  - job_name: payments
    static_configs:
      - targets: ["payments:8000"]
