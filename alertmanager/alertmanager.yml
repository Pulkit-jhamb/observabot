global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Add Slack / PagerDuty receivers here. Alerts are visible in the Alertmanager UI
  # on :9093 and through ObservaBot's get_firing_alerts tool.
  - name: default
